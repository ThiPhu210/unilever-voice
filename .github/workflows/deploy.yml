name: Deploy to AWS
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # cho OIDC
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - working-directory: backend
        run: |
          pip install fastapi "uvicorn[standard]" python-multipart rapidfuzz pytest httpx
          pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/unilever-voice-api:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/unilever-voice-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/unilever-voice-web:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/unilever-voice-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Deploy to EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:App,Values=unilever-voice" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "Không tìm thấy EC2 đang chạy (tag App=unilever-voice). Instance có đang Stop không?"; exit 1
          fi
          echo "Instance: $INSTANCE_ID"

          ACCOUNT="${REGISTRY%%.*}"
          COMPOSE_B64=$(base64 -w0 deploy/docker-compose.prod.yml)
          SCRIPT_B64=$(base64 -w0 deploy/remote-deploy.sh)
          CMD="mkdir -p /opt/app && echo $COMPOSE_B64 | base64 -d > /opt/app/docker-compose.yml && echo $SCRIPT_B64 | base64 -d > /opt/app/remote-deploy.sh && REGION=$AWS_REGION ACCOUNT=$ACCOUNT API_IMAGE=$REGISTRY/unilever-voice-api:${GITHUB_SHA} WEB_IMAGE=$REGISTRY/unilever-voice-web:${GITHUB_SHA} bash /opt/app/remote-deploy.sh"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA}" \
            --timeout-seconds 900 \
            --parameters "commands=[\"$CMD\"]" \
            --query 'Command.CommandId' --output text)

          # Chờ lệnh chạy xong (tối đa ~15 phút)
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "[$i] $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{out:StandardOutputContent,err:StandardErrorContent}' --output text | tail -60
          [ "$STATUS" = "Success" ]
