name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - name: Install (không cần faster-whisper khi test)
        working-directory: backend
        run: pip install fastapi "uvicorn[standard]" python-multipart rapidfuzz pytest httpx
      - name: Test parser + API
        working-directory: backend
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - working-directory: web
        run: npm ci && npm run build
