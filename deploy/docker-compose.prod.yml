services:
  api:
    image: ${API_IMAGE}
    env_file: .env
    environment:
      DB_PATH: /data/app.db
      AUDIO_DIR: /data/audio
      HF_HOME: /data/hf
      PRELOAD_ASR: "1"
    volumes:
      - appdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    image: ${WEB_IMAGE}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  appdata:
  caddy_data:
  caddy_config:
