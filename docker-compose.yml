services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voicedev
      POSTGRES_DB: voicecoach
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voicecoach"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      API_KEY: devkey1234567890
      ASR_MODEL: small
      PRELOAD_ASR: "0"
      DATABASE_URL: postgresql://voice:voicedev@db:5432/voicecoach
    volumes: [appdata:/data]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./web
    environment:
      SITE_ADDRESS: ":80"
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  appdata:
  pgdata:
